services:
  db:
    image: postgres:16-alpine
    container_name: lc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"          # host 5434 -> container 5432 (avoids clashing with a local Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: lc_api
    restart: unless-stopped
    env_file: .env
    environment:
      # inside Docker the host is the service name "db", port 5432
      DB_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./staging:/code/staging
      - ./logs:/code/logs
    command: uvicorn app.backend.api:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
